version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: club_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: club_platform
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: club_backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=club_platform
      - MINIO_ENDPOINT=minio
      - MINIO_EXTERNAL_ENDPOINT=localhost
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=club-platform
      - JWT_SECRET=supersecretjwtkey
      - JWT_REFRESH_SECRET=supersecretrefreshkey
      - FRONTEND_URL=http://localhost:5173
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1512418311130972171/D9EYLhTL218DOTxCPc2sYHuesQhvzPE2Hj_oKbtG2O4PYshpkh6vyDTd6zEW4PLAcka8
    depends_on:
      - mysql
      - minio

  minio:
    image: minio/minio
    container_name: club_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: club_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  minio_data: